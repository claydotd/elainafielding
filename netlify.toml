[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Override in the Netlify UI if the live domain is different.
  VITE_SITE_URL = "https://elainafielding.co.uk"

[dev]
  # #custom keeps the dev proxy from rewriting Vite modules to index.html.
  # The dev script is `netlify dev`, so the command here must stay the Vite server.
  framework = "#custom"
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Scanner paths such as /wp-login.php. Must stay above the SPA fallback.
[[redirects]]
  from = "/*.php"
  to = "/index.html"
  status = 404
  force = true

# Keep API routes on the function. This must stay above the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side routes such as /work and /about. Existing files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/works/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/about/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
