[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Override in the Netlify UI if the live domain is different.
  VITE_SITE_URL = "https://elainafielding.co.uk"

# Client-side routes such as /work and /about. Existing files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
